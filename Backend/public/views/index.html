<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yayasan Sahabat Qur'an</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/style.css" />
    
  <style>
    /* --- CSS UTAMA (DESKTOP) --- */
    .footer-pill-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      pointer-events: none; /* Container tidak menghalangi dashboard */
    }

    .footer-pill {
      pointer-events: auto;
      display: flex;
      align-items: center;
      flex-direction: row-reverse;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 8px 18px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: default; /* Default agar tidak semua teks dikira tombol */
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .pill-content-wrapper {
      display: flex;
      align-items: center;
      flex-direction: row-reverse;
    }

    .nexlix-label {
      font-weight: 900;
      letter-spacing: 1px;
      color: #FFD700;
      font-size: 13px;
      margin-left: 12px;
      user-select: none;
      cursor: pointer; /* Memberitahu bahwa ini bisa diklik */
      transition: transform 0.2s ease;
    }

    .nexlix-label:hover {
      transform: scale(1.05);
      color: #fff;
    }

    .footer-text {
      display: flex;
      align-items: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      white-space: nowrap;
    }

    .footer-text a { 
      color: inherit; 
      text-decoration: none; 
      cursor: pointer;
    }
    .footer-text a:hover { text-decoration: underline; color: #fff; }

    .sep { margin: 0 8px; color: rgba(255, 255, 255, 0.2); }

    /* Nama Tim: Muncul di sebelah kiri saat aktif */
    .dev-reveal {
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      white-space: nowrap;
      font-size: 11px;
      color: #fff;
      transition: all 0.5s ease;
    }

    /* ANIMASI AKTIF */
    .footer-pill.active {
      background: rgba(0, 0, 0, 0.85);
      border-color: #FFD700;
    }

    .footer-pill.active .dev-reveal {
      max-width: 500px;
      opacity: 1;
      margin-right: 15px;
      padding-right: 15px;
      border-right: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* --- MEDIA QUERIES (MOBILE) --- */
    @media (max-width: 768px) {
      .footer-pill-container {
        right: 10px;
        bottom: 10px;
        width: auto;
        max-width: calc(100% - 20px);
      }

      .footer-pill {
        flex-direction: column; 
        align-items: flex-end;
        padding: 10px 16px;
        border-radius: 20px;
      }

      .pill-content-wrapper {
        width: 100%;
        display: flex;
        flex-direction: row-reverse;
        align-items: center;
        justify-content: flex-start;
      }

      .nexlix-label {
        font-size: 11px;
        margin-left: 8px;
      }

      .footer-text {
        font-size: 9px;
      }

      /* Sembunyikan 'Handcrafted by' di baris utama mobile agar ramping */
      .footer-text span:last-child, 
      .footer-text .sep:last-of-type {
        display: none;
      }

      .dev-reveal {
        width: 100%;
        white-space: normal;
        text-align: right;
        font-size: 10px;
        line-height: 1.5;
        max-height: 0;
        opacity: 0;
        color: #FFD700;
        transition: all 0.4s ease-in-out;
      }

      .footer-pill.active .dev-reveal {
        max-height: 100px;
        opacity: 1;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        border-right: none;
        padding-right: 0;
        margin-right: 0;
      }

      .footer-pill.active .dev-reveal::before {
        content: "Handcrafted by:";
        display: block;
        font-size: 8px;
        color: rgba(255, 255, 255, 0.5);
        margin-bottom: 2px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="overlay">
      <img src="/images/LogoYSQ.png" alt="Logo YSQ">
      <h1>SELAMAT DATANG DI YAYASAN<br>SAHABAT QUR'AN</h1>
      <div class="buttons">
        <a href="/login" class="btn btn-gold">Login</a>
        <a href="/daftar" class="btn btn-dark">Pendaftaran Santri Baru</a>
      </div>
    </div>

    <div class="footer-pill-container">
      <div id="footer-trigger" class="footer-pill">
        
        <div class="pill-content-wrapper">
            <span class="nexlix-label" id="label-target">NEXLIX DEV</span>
            
            <div class="footer-text">
              <span>© 2026 Yayasan Sahabat Qur'an</span>
              <span class="sep">|</span>
              <a href="https://sahabatquran.com/" target="_blank">sahabatquran.com</a>
              <span class="sep">|</span>
              <span>Handcrafted by</span>
            </div>
        </div>

        <div class="dev-reveal">
          By: Riska Sugiarto, Rahma Fitria Tunnisa, & Prameswari Kirana Jingga
        </div>

      </div>
    </div>
  </div>

  <script>
    const labelTarget = document.getElementById('label-target');
    const footerPill = document.getElementById('footer-trigger');

    // Hanya NEXLIX DEV yang bisa toggle menu
    labelTarget.addEventListener('click', function(e) {
      e.stopPropagation(); // Mencegah bubbling
      footerPill.classList.toggle('active');
    });

    // Menutup menu jika klik di area manapun di dashboard
    document.addEventListener('click', function(e) {
      if (!footerPill.contains(e.target)) {
        footerPill.classList.remove('active');
      }
    });
  </script>

</body>
</html>
